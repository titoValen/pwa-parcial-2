<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Sin conexión — Wayra</title>
    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/offline.css">
  </head>
  <body>
    <div id="banner-offline">
      <span class="dot"></span>
      Sin conexión — mostrando tus lugares guardados
    </div>

    <header>
      <figure><img src="assets/icon/logo_texto.webp" alt="Logo de Wayra"></figure>
    </header>

    <main>
      <span class="titulo-seccion">Tus lugares</span>

      <div id="empty">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
            stroke="#94a3b8"
            stroke-width="1.5"
          />
          <circle cx="12" cy="9" r="2.5" stroke="#94a3b8" stroke-width="1.5" />
        </svg>
        <p>
          No tenés lugares guardados todavía.<br />Conectate para agregar tu
          primer lugar.
        </p>
      </div>

      <section id="lista"></section>
    </main>

    <footer>
      <span>Creado por el alumno Tito Valentín</span>
    </footer>

    <script>
      const DB_NAME = "lugaresDB";
      const DB_STORE_NAME = "lugares";

      const abrirDB = () => {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
      };

      const obtenerLugares = async () => {
        const db = await abrirDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readonly");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.getAll();
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
      };

      const renderLugares = async () => {
        const lista = document.querySelector("#lista");
        const empty = document.querySelector("#empty");

        try {
          const lugares = await obtenerLugares();

          if (lugares.length === 0) {
            empty.style.display = "flex";
            return;
          }

          lugares.forEach((lugar) => {
            const card = document.createElement("article");
            card.innerHTML = `
              <h3>${lugar.nombre}</h3>
              ${lugar.descripcion ? `<p>${lugar.descripcion}</p>` : ""}
              <span class="coords">📍 ${lugar.latitud.toFixed(4)}, ${lugar.longitud.toFixed(4)}</span>
              <span class="fecha">${new Date(lugar.fecha).toLocaleDateString("es-AR", { day: "2-digit", month: "long", year: "numeric" })}</span>
            `;
            lista.appendChild(card);
          });
        } catch (err) {
          empty.style.display = "flex";
        }
      };

      renderLugares();

      // Si vuelve la conexión, redirige automáticamente
      window.addEventListener("online", () => {
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
