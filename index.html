<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Wayra</title>

    <link rel="manifest" href="manifest.json" />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/index.css" />

    <!-- JS -->
    <script defer type="module" src="js/app.js"></script>
  </head>
  <body>
    <header>
      <figure><img src="assets/icon/logo_texto.webp" alt="Logo de Wayra"></figure>
    </header>

    <main>
      <div
        id="banner-offline"
        style="
          display: none;
          background: #ef4444;
          color: white;
          text-align: center;
          padding: 0.5rem;
        "
      >
        Sin conexión — mostrando datos guardados
      </div>
      <div id="mapa"></div>
      <button id="openModal">Agregar lugar</button>
      <section></section>

      <dialog id="modal">
        <form id="form">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" />
          <label for="descripcion">Descripción</label>
          <input type="text" id="descripcion" />
          <button type="button" id="btnGps">Obtener ubicación</button>
          <input type="number" id="latitud" readonly />
          <input type="number" id="longitud" readonly />

          <div class="container-btn">
            <button type="submit" id="formAdd">Agregar</button>
            <button type="button" id="formClose">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>

    <footer><span>Creado por el alumno Tito Valentín</span></footer>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }

      const dialog = document.querySelector("#modal");
      const openModal = document.querySelector("#openModal");
      const closeModal = document.querySelector("#formClose");

      openModal.addEventListener("click", () => {
        dialog.showModal();
      });

      closeModal.addEventListener("click", () => {
        dialog.close();
      });
    </script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </body>
</html>
